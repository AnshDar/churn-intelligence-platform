name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data & train baseline (fast, no tuning)
        run: |
          python -m src.generate_data
          python -c "from src.model import run_pipeline; run_pipeline(tune=False)"
          python -m src.explain

      - name: Seed scoring history (for API/dashboard tests)
        run: python -m src.simulate --batches 3 --batch-size 20 --reset

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: pytest -q

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: churn-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name churn -p 8000:8000 churn-platform:ci
          echo "Waiting for the API to become healthy…"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "API is up."; break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          docker rm -f churn
